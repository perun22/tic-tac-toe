<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tic Tac Toe game</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="container">
      <h1 class="title">TIC TAC TOE</h1>
      <div class="input-container">
        <label for="player-one">Player One</label>
        <input type="text" id="player-one" name="player-one" /><br />
        <label for="player-two">Player Two</label>
        <input type="text" id="player-two" name="player-two" /><br />
        <input type="submit" value="start" id="start-btn" class="btn" />
      </div>
      <p class="message"></p>
      <div class="board"></div>
      <button id="restart-btn" class="btn">Restart</button>
    </main>
  </body>
</html>
